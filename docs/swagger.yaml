basePath: /api
definitions:
  models.AvailabilityRequest:
    properties:
      date_begin:
        type: string
      date_end:
        type: string
      user_id:
        type: integer
    type: object
  models.AvailabilityResponse:
    properties:
      date_begin:
        type: string
      date_end:
        type: string
      id:
        type: integer
      user_id:
        type: integer
    type: object
  models.ColorRequest:
    properties:
      hex_code:
        type: string
      name:
        type: string
    type: object
  models.ColorResponse:
    properties:
      hex_code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  models.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      surname:
        type: string
      username:
        type: string
    type: object
  models.DateRequest:
    properties:
      body:
        type: string
      color_id:
        type: integer
      date_begin:
        type: string
      date_end:
        type: string
      private:
        type: boolean
      recurrence_id:
        type: integer
      title:
        type: string
      user_id:
        type: integer
    type: object
  models.DateResponse:
    properties:
      body:
        type: string
      color_id:
        type: integer
      date_begin:
        type: string
      date_end:
        type: string
      id:
        type: integer
      private:
        type: boolean
      recurrence_id:
        type: integer
      title:
        type: string
      user_id:
        type: integer
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.GetUserRequest:
    properties:
      email:
        type: string
      username:
        type: string
    type: object
  models.GroupRequest:
    properties:
      creator_id:
        type: integer
      name:
        type: string
    required:
    - creator_id
    - name
    type: object
  models.GroupResponse:
    properties:
      creator_id:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  models.TokenRequest:
    properties:
