services:
  postgres:
    container_name: yplanning-postgres
    image: postgres:18.2-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${PORT_DB}:5432

  yplanning_api:
    container_name: yplanning-api
    build:
      context: ./API
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      PORT: ${PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CONNECTION_STRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${PORT_DB}/${POSTGRES_DB}?sslmode=disable
    ports:
      - ${PORT}:${PORT}

volumes:
  postgres_data:
